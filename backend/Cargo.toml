[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
cookie = "0.18"
dotenvy = "0.15.7"
futures-util = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = {version = "0.8",features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "derive"]}
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
validator = { version = "0.20", features = ["derive"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
azure_storage_blob = "1.1.0"
azure_identity = "1.0.0"
azure_core = "1.1.0"
azure_storage_sas = "1.0.0"
url = "2.5.8"
time = "0.3.55"
base64 = "0.23.1"

